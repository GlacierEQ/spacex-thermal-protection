[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glaciereq-thermal-scenario-lab"
version = "1.0.0"
description = "Independent local multi-tile thermal scenario and native Odin reference laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
thermal-scenario-demo = "thermal_scenario_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["alpha"]
py-modules = ["thermal_scenario_cli", "promotion_authority"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
